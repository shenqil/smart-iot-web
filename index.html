<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart IoT 物联网平台</title>
    <script>
      (() => {
        const path = window.location.pathname
        if (path === '/h5' || path.startsWith('/h5/')) return
        const isMobile =
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent) ||
          window.matchMedia?.('(max-width: 768px) and (pointer: coarse)').matches ||
          (navigator.maxTouchPoints > 2 && /Macintosh/.test(navigator.userAgent) && window.innerWidth <= 1024)
        if (isMobile) {
          const search = window.location.search || ''
          const hash = window.location.hash || ''
          if (path === '/login') {
            window.location.replace(`/h5/login${search}${hash}`)
          } else {
            const appMatch = /^\/app\/(\d+)(?:\/(monitor|alarms|operations))?\/?$/.exec(path)
            if (appMatch) {
              const page = appMatch[2] === 'alarms' ? 'alarms' : appMatch[2] === 'operations' ? 'operations' : 'home'
              window.location.replace(`/h5/${appMatch[1]}/${page}${search}${hash}`)
            } else {
              window.location.replace(`/h5${search}${hash}`)
            }
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div
        role="status"
        aria-live="polite"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100dvh;
          width: 100%;
          padding: 24px;
          box-sizing: border-box;
          background: radial-gradient(ellipse at 50% 35%, #ebf5ee 0%, #f4f7f4 65%, #eef3ef 100%);
          color: #1d3b2e;
          font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        "
      >
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 18px">
          <svg
            aria-hidden="true"
            viewBox="0 0 50 50"
            style="width: 64px; height: 64px; animation: siot-spin 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite"
          >
            <circle cx="25" cy="25" r="20" fill="none" stroke="#d4e8dd" stroke-width="3.5" />
            <circle
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke="#16765f"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-dasharray="80, 150"
              stroke-dashoffset="0"
            />
          </svg>
          <div
            style="
              position: absolute;
              inset: 0;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #16765f;
            "
          >
            <svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <line x1="8" y1="21" x2="16" y2="21" />
              <line x1="12" y1="17" x2="12" y2="21" />
            </svg>
          </div>
        </div>
        <div style="font-size: 16px; font-weight: 600; letter-spacing: 0.04em; color: #1d3d30; margin-bottom: 6px">
          智能物联网
        </div>
        <div
          style="
            font-size: 12px;
            color: #6e8578;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 4px;
          "
        >
          <span>系统加载中</span>
          <span style="display: inline-flex; animation: siot-pulse 1.4s ease-in-out infinite">…</span>
        </div>
        <style>
          @keyframes siot-spin {
            0% {
              transform: rotate(0deg);
            }
            100% {
              transform: rotate(360deg);
            }
          }
          @keyframes siot-pulse {
            0%,
            100% {
              opacity: 0.3;
            }
            50% {
              opacity: 1;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/pc/main.tsx"></script>
  </body>
</html>
