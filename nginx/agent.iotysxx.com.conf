# 80 端口 HTTP 请求自动 301 重定向至 443 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name agent.iotysxx.com;

    return 301 https://$host$request_uri;
}

# 443 端口 HTTPS 服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.iotysxx.com;

    # SSL 证书与私钥路径
    ssl_certificate /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.key;

    # SSL 安全与性能优化配置
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 1. 前端静态资源根目录 (请确认与你部署 dist 的实际路径一致)
    root /var/www/smart-iot/dist;
    index index.html;

    # 客户端上传限制
    client_max_body_size 10m;

    # 萤石视频 (EZUIKit) CSP 安全策略
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tianditu.gov.cn https://*.aliyuncs.com https://*.ys7.com; connect-src 'self' https://*.aliyuncs.com https://*.ys7.com https://*.ys7.com:* wss://*.ys7.com:*; style-src 'self' 'unsafe-inline' https://openstatic.ys7.com; script-src 'self' 'wasm-unsafe-eval' https://openstatic.ys7.com; worker-src 'self' blob: https://openstatic.ys7.com; media-src 'self' blob:; font-src 'self' data: https://openstatic.ys7.com" always;

    # 静态资源缓存策略
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /h5/index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # H5 移动端单页路由 fallback
    location ^~ /h5 {
        try_files $uri $uri/ /h5/index.html;
    }

    # PC 桌面端单页应用路由 fallback (页面刷新 404 兜底)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务接口反向代理 (后端 HTTP REST 端口 10888)
    location /api/ {
        proxy_pass http://127.0.0.1:10888;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 30s;
    }

    # 历史数据流式输出：关闭缓冲，后端最长 5 分钟
    location ~ ^/api/v1/app/devices/\d+/history$ {
        proxy_pass http://127.0.0.1:10888;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 330s;
    }

    # 天地图搜索 / 逆地理编码代理
    # 注意：宿主机部署不能保留 ${TDT_SERVER_KEY} 占位符
    location /tdt-api/ {
        rewrite ^/tdt-api/(.*)$ /$1 break;
        # 如果有天地图 Server Key，填入下方；如果没有用到，可将整个 location /tdt-api/ 块删除
        set $args "$args&tk=你的天地图服务端KEY";
        proxy_pass https://api.tianditu.gov.cn;
        proxy_set_header Host api.tianditu.gov.cn;
        proxy_ssl_server_name on;
    }

    # Gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
}
